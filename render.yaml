services:
  - type: web
    name: rota-do-croquete-web
    env: static
    buildCommand: npx expo export --platform web && echo "/* /index.html 200" > dist/_redirects
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_BACKEND_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
