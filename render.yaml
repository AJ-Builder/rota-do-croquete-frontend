services:
  - type: web
    name: rota-do-croquete-web
    env: static
    buildCommand: npx expo export --platform web && echo "/* /index.html 200" > dist/_redirects && cp assets/icon.png dist/icon.png
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_BACKEND_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-store, no-cache, max-age=0, must-revalidate
      - path: /*
        name: Pragma
        value: no-cache
      - path: /*
        name: Surrogate-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
